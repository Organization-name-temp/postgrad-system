      summary: "The acting Student's schedule — their minted Enrollments, grouped by Semester."
      operationId: theActingStudentsScheduleTheirMintedEnrollmentsGroupedBySemester
      description: "The Student's academic present (user story 32, FR-REG-005): every Enrollment the\nadvisor minted, grouped by Semester (most recent first), each carrying its Course\nStatus, Enrollment Classification, registration-time credit hours, and the live\ndisplay facts — course, instructor, weekly meeting times — read through the Catalog/\nOffering facades (ADR-0017).\n\nEach group also carries the **period-gated change context** (ticket 07, FR-REG-004),\nso the SPA can surface the right in-window actions while the server stays the sole\nauthority: `current_period` (the derived phase — upcoming / registration / add_drop /\nlate_add / withdrawal / closed), `can_free_change` (in the add/drop window *and* the\nStudent has an approved Initial request — free add/drop is live), `can_withdraw` (in\nthe withdrawal window), and — only when free change is live — `addable_courses`, the\neligible Offerings not yet on the schedule and not External Electives (those need a\nrequest). Each enrollment also carries its derived `attendance` (ticket 08) — present/\nrecorded counts, the display percentage, and the audit-at-risk flag. Gated on\n`courses.register_self` (the acting Student, R02)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      semester:
                        id: 1
                        term: Fall
