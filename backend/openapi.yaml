          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No application found.'
                properties:
                  message:
                    type: string
                    example: 'No application found.'
      tags:
        - Admissions
      security: []
    patch:
      summary: 'Save Step 1 (partial).'
      operationId: saveStep1partial
      description: "Persists whatever personal-info fields the applicant has entered so far, so\nthey can save and resume, or go Back from a later step to correct one. Each\nprovided field is validated (bilingually); missing fields are allowed. Editing\nstays open while the application is in the applicant's hands (through email\nverification) and locks once it enters Student Affairs review."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: draft
                    admission_cycle_id: 1
                    name_en: 'Sara Applicant'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: draft
                      admission_cycle_id:
                        type: integer
                        example: 1
                      name_en:
                        type: string
                        example: 'Sara Applicant'
        409:
          description: 'not editable'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This application can no longer be edited.'
                properties:
                  message:
                    type: string
                    example: 'This application can no longer be edited.'
        422:
          description: validation
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The gender field must be a valid value.'
                  errors:
                    gender:
                      - 'The gender field must be a valid value.'
                properties:
                  message:
                    type: string
                    example: 'The gender field must be a valid value.'
                  errors:
                    type: object
                    properties:
                      gender:
                        type: array
                        example:
                          - 'The gender field must be a valid value.'
                        items:
                          type: string
      tags:
        - Admissions
      requestBody:
        required: false
        content:
          application/json:
