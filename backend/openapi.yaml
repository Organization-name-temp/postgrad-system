  '/api/v1/class-sessions/{class_session_id}':
    patch:
      summary: 'Cancel or reinstate a Class Session.'
      operationId: cancelOrReinstateAClassSession
      description: "Toggles a session's cancellation (Eid, illness — also the holiday answer). A cancelled\nsession counts in no attendance denominator; reinstating it counts it again. Correctable\neither way. Authorised by assignment — only the session's Offering's Instructor, or an\nadministrator (R09/R10) acting on an offering they don't teach, that write attributed to\nthem in the Audit Log (else 403; ADR-0015)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 10
                    date: '2026-02-16'
                    weekday: 1
                    starts_at: '09:00'
                    ends_at: '11:00'
                    cancelled: true
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 10
                      date:
                        type: string
                        example: '2026-02-16'
                      weekday:
                        type: integer
                        example: 1
                      starts_at:
                        type: string
                        example: '09:00'
                      ends_at:
                        type: string
                        example: '11:00'
                      cancelled:
                        type: boolean
                        example: true
        403:
          description: 'not the assigned instructor'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'You are not assigned to teach this offering.'
                properties:
                  message:
                    type: string
                    example: 'You are not assigned to teach this offering.'
      tags:
        - Enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cancelled:
                  type: boolean
                  description: 'Whether the session is cancelled.'
                  example: true
              required:
                - cancelled
      security: []
    parameters:
      -
        in: path
        name: class_session_id
        description: 'The ID of the class session.'
        example: 10
        required: true
        schema:
          type: integer
  '/api/v1/class-sessions/{class_session_id}/attendance':
    put:
      summary: "Record (or correct) a session's attendance register."
      operationId: recordorCorrectASessionsAttendanceRegister
      description: "Saves a binary present/absent mark per active Enrollment for one Class Session; a save\nupserts, so a correction overwrites. Only the Offering's active roster may be marked;\na cancelled session cannot be marked. Around the save the percentages are recomputed:\nany **Audit** Enrollment whose percentage crosses below the threshold on this save\nraises one `attendance.audit_at_risk` notification (fired once on the downward crossing,\nnever on every mark). Authorised by assignment — only this Offering's Instructor, or an\nadministrator (R09/R10) recording/correcting attendance on an offering they don't teach,\nthat write attributed to them in the Audit Log (else 403; ADR-0015)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    session_id: 10
                    attendance:
                      -
                        enrollment_id: 5
                        present: 8
                        recorded: 10
                        percentage: 80
                        at_risk: false
                properties:
                  data:
                    type: object
                    properties:
                      session_id:
                        type: integer
                        example: 10
                      attendance:
                        type: array
                        example:
                          - enrollment_id: 5
                            present: 8
                            recorded: 10
                            percentage: 80
                            at_risk: false
                        items:
                          type: object
                          properties:
                            enrollment_id:
                              type: integer
                              example: 5
                            present:
                              type: integer
                              example: 8
                            recorded:
                              type: integer
                              example: 10
                            percentage:
                              type: integer
                              example: 80
                            at_risk:
                              type: boolean
                              example: false
        403:
          description: 'not the assigned instructor'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'You are not assigned to teach this offering.'
                properties:
                  message:
                    type: string
                    example: 'You are not assigned to teach this offering.'
        409:
          description: 'session cancelled'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'A cancelled session cannot be marked.'
                properties:
                  message:
                    type: string
                    example: 'A cancelled session cannot be marked.'
        422:
          description: 'not on this roster'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "One or more students are not on this offering's roster."
                  errors:
                    marks:
                      - "One or more students are not on this offering's roster."
                properties:
                  message:
                    type: string
                    example: "One or more students are not on this offering's roster."
                  errors:
                    type: object
                    properties:
                      marks:
                        type: array
                        example:
                          - "One or more students are not on this offering's roster."
                        items:
                          type: string
      tags:
        - Enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                marks:
                  type: array
                  description: 'One entry per student to mark.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      enrollment_id:
                        type: integer
                        description: 'An active Enrollment on this offering.'
                        example: 5
                      present:
                        type: boolean
                        description: 'Whether the student was present.'
                        example: true
                    required:
                      - enrollment_id
                      - present
              required:
                - marks
      security: []
    parameters:
      -
        in: path
        name: class_session_id
        description: 'The ID of the class session.'
        example: 10
        required: true
        schema:
          type: integer
