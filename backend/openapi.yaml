openapi: 3.0.3
info:
  title: 'PRS API Documentation'
  description: ''
  version: 1.0.0
servers:
  - url: 'http://localhost'
tags:
  - name: Admissions
    description: "\nManage Admission Cycles — the windowed Fall/Spring intake (e.g. \"Fall 2026\")\nevery Application hangs off. Listing/creating/editing/activating requires the\ncalendar.manage permission (Student Affairs or a Dean). A Cycle is \"open\" when\nit is active and the current moment falls inside its window — derived, never a\nstored status column (ADR-0012, ticket 01). Cycles are deactivated, never\ndeleted. The {@see self::open()} lookup is public — it feeds the\nunauthenticated registration screen."
  - name: Catalog
    description: "\nThe catalog browse tree — the whole academic hierarchy (Faculty → Department →\nProgram → Category → Course) in a single read-model payload so the front end can\nrender and search it client-side without chatty per-node requests (FR-PCM-002,\nspec §API). Every node carries both language names; Course nodes carry their\nactive status so retired courses read accessibly. Reading requires catalog.view —\nthe catalog is universally browsable (ADR-0008). \"University\" is a synthetic root\nthe SPA prepends; it is not an entity, so it is not in this payload."
  - name: Endpoints
    description: ''
  - name: Notifications
    description: "\nA signed-in user's own in-app notifications — the data behind the shell's bell\n(ticket 02). Every endpoint is scoped to the authenticated user by\n{@see Notification::scopeForUser()}, so no request can list, count, or mutate\nanother user's notifications (a foreign id simply is not found → 404). Content\nis a type + payload; the SPA renders it bilingually, so nothing here is\nlocalised server-side."
paths:
  /api/v1/admission-cycles/open:
    get:
      summary: 'List currently-open Admission Cycles.'
      operationId: listCurrentlyOpenAdmissionCycles
      description: "Public, unauthenticated: the front door the registration screen reads to\nknow whether (and into which intake) a stranger may apply. Returns only\nCycles that are active and whose window contains the current moment."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      intake_term: Fall
                      year: 2026
                      name_en: 'Fall 2026'
                      name_ar: 'خريف 2026'
                      opens_at: '2026-06-01T00:00:00+00:00'
                      closes_at: '2026-08-01T00:00:00+00:00'
                      is_active: true
                      is_open: true
                properties:
                  data:
                    type: array
                    example:
                      - id: 1
                        intake_term: Fall
                        year: 2026
                        name_en: 'Fall 2026'
                        name_ar: 'خريف 2026'
                        opens_at: '2026-06-01T00:00:00+00:00'
                        closes_at: '2026-08-01T00:00:00+00:00'
                        is_active: true
                        is_open: true
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        intake_term:
                          type: string
                          example: Fall
                        year:
                          type: integer
                          example: 2026
                        name_en:
                          type: string
                          example: 'Fall 2026'
                        name_ar:
                          type: string
                          example: 'خريف 2026'
                        opens_at:
                          type: string
                          example: '2026-06-01T00:00:00+00:00'
                        closes_at:
                          type: string
                          example: '2026-08-01T00:00:00+00:00'
                        is_active:
                          type: boolean
                          example: true
                        is_open:
                          type: boolean
                          example: true
      tags:
        - Admissions
      security: []
  /api/v1/register:
    post:
      summary: 'Register and start an application.'
      operationId: registerAndStartAnApplication
      description: "Open only while an Admission Cycle's window is open: refused when none is\nopen, auto-filed into the one open Cycle, or (when several are open) filed\ninto the chosen one. Rate-limited per client. On success the applicant is\nauthenticated and their Draft Application is returned."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: draft
                    admission_cycle_id: 1
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: draft
                      admission_cycle_id:
                        type: integer
                        example: 1
        409:
          description: 'admissions closed'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Admissions are currently closed.'
                properties:
                  message:
                    type: string
                    example: 'Admissions are currently closed.'
        422:
          description: validation
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The email has already been taken.'
                  errors:
                    email:
                      - 'The email has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The email has already been taken.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
      tags:
        - Admissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "The applicant's full name."
                  example: 'Sara Applicant'
                email:
                  type: string
                  description: 'A unique email address; becomes the login.'
                  example: sara@example.com
                password:
                  type: string
                  description: 'At least 8 characters; must match the confirmation.'
                  example: correct-horse
                password_confirmation:
                  type: string
                  description: 'Repeat of the password.'
                  example: correct-horse
                admission_cycle_id:
                  type: integer
                  description: 'The open Cycle to apply to. Required only when more than one Cycle is open; otherwise the single open Cycle is used.'
                  example: 1
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/admission-cycles:
    get:
      summary: 'List Admission Cycles.'
      operationId: listAdmissionCycles
      description: "Newest intake first. Requires calendar.manage — this is the management\nlist; the public registration screen uses the open-cycle lookup instead."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      intake_term: Fall
                      year: 2026
                      name_en: 'Fall 2026'
                      name_ar: 'خريف 2026'
                      opens_at: '2026-06-01T00:00:00+00:00'
                      closes_at: '2026-08-01T00:00:00+00:00'
                      is_active: true
                      is_open: true
                properties:
                  data:
                    type: array
                    example:
                      - id: 1
                        intake_term: Fall
                        year: 2026
                        name_en: 'Fall 2026'
                        name_ar: 'خريف 2026'
                        opens_at: '2026-06-01T00:00:00+00:00'
                        closes_at: '2026-08-01T00:00:00+00:00'
                        is_active: true
                        is_open: true
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        intake_term:
                          type: string
                          example: Fall
                        year:
                          type: integer
                          example: 2026
                        name_en:
                          type: string
                          example: 'Fall 2026'
                        name_ar:
                          type: string
                          example: 'خريف 2026'
                        opens_at:
                          type: string
                          example: '2026-06-01T00:00:00+00:00'
                        closes_at:
                          type: string
                          example: '2026-08-01T00:00:00+00:00'
                        is_active:
                          type: boolean
                          example: true
                        is_open:
                          type: boolean
                          example: true
      tags:
        - Admissions
      security: []
    post:
      summary: 'Create an Admission Cycle.'
      operationId: createAnAdmissionCycle
      description: ''
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    intake_term: Fall
                    year: 2026
                    name_en: 'Fall 2026'
                    name_ar: 'خريف 2026'
                    opens_at: '2026-06-01T00:00:00+00:00'
                    closes_at: '2026-08-01T00:00:00+00:00'
                    is_active: true
                    is_open: true
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      intake_term:
                        type: string
                        example: Fall
                      year:
                        type: integer
                        example: 2026
                      name_en:
                        type: string
                        example: 'Fall 2026'
                      name_ar:
                        type: string
                        example: 'خريف 2026'
                      opens_at:
                        type: string
                        example: '2026-06-01T00:00:00+00:00'
                      closes_at:
                        type: string
                        example: '2026-08-01T00:00:00+00:00'
                      is_active:
                        type: boolean
                        example: true
                      is_open:
                        type: boolean
                        example: true
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The intake term has already been taken.'
                  errors:
                    intake_term:
                      - 'The intake term has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The intake term has already been taken.'
                  errors:
                    type: object
                    properties:
                      intake_term:
                        type: array
                        example:
                          - 'The intake term has already been taken.'
                        items:
                          type: string
      tags:
        - Admissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intake_term:
                  type: string
                  description: 'Fall or Spring.'
                  example: Fall
                year:
                  type: integer
                  description: 'The intake year.'
                  example: 2026
                name_en:
                  type: string
                  description: 'English name.'
                  example: 'Fall 2026'
                name_ar:
                  type: string
                  description: 'Arabic name.'
                  example: 'خريف 2026'
                opens_at:
                  type: string
                  description: 'When the application window opens (ISO 8601).'
                  example: '2026-06-01T00:00:00+00:00'
                closes_at:
                  type: string
                  description: 'When the application window closes (ISO 8601, after opens_at).'
                  example: '2026-08-01T00:00:00+00:00'
              required:
                - intake_term
                - year
                - name_en
                - name_ar
                - opens_at
                - closes_at
      security: []
