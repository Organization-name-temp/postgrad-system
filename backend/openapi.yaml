  '/api/v1/applications/{application_id}/screen':
    post:
      summary: 'Screen an application.'
      operationId: screenAnApplication
      description: "The Student Affairs decision on a queued application: `approve` auto-advances it\nthrough the transient `sa_approved` to `under_dean_review` in one action;\n`return` sends it back to the applicant as `returned_for_revision` with the\nreviewer's instructions; `reject` ends it as `rejected` with a reason. `return`\nand `reject` require a note and notify the applicant. Any action on an\napplication not `under_sa_review` is an illegal transition (409). Gated on\n`application.screen`."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: approved
                    type: object
                    example:
                      data:
                        id: 1
                        status: under_dean_review
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          status:
                            type: string
                            example: under_dean_review
                  -
                    description: returned
                    type: object
                    example:
                      data:
                        id: 1
                        status: returned_for_revision
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          status:
                            type: string
                            example: returned_for_revision
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
        409:
          description: 'not under review'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This application cannot move from draft to sa_approved.'
                properties:
                  message:
                    type: string
                    example: 'This application cannot move from draft to sa_approved.'
        422:
          description: 'missing note'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The note field is required when action is return.'
                  errors:
                    note:
                      - 'The note field is required when action is return.'
                properties:
                  message:
                    type: string
                    example: 'The note field is required when action is return.'
                  errors:
                    type: object
                    properties:
                      note:
                        type: array
                        example:
                          - 'The note field is required when action is return.'
                        items:
                          type: string
      tags:
        - Admissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  description: 'One of approve, return, reject.'
                  example: approve
                note:
                  type: string
                  description: "The reviewer's note; required for return and reject."
                  example: 'Please re-upload a clearer copy of your transcript.'
                  nullable: true
              required:
                - action
      security: []
    parameters:
      -
        in: path
        name: application_id
        description: "The application's id."
        example: 1
        required: true
        schema:
          type: integer
