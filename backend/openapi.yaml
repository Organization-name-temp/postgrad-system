      operationId: choosePrograms
      description: "Validates and stores the applicant's primary and optional alternative Program.\nEach id must be a real Program; the primary's degree level must match the\n`applying_for_degree` from Step 1; and the applicant's previous degree must\nqualify them for each chosen Program's level. A bad id, a level mismatch, or an\nunqualified Program is a 422; selecting once the application has left the\napplicant's hands (finalized/in review) is a 409."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: email_verified
                    admission_cycle_id: 1
                    primary_program_id: 1
                    alternative_program_id: 2
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: email_verified
                      admission_cycle_id:
                        type: integer
                        example: 1
                      primary_program_id:
                        type: integer
                        example: 1
                      alternative_program_id:
                        type: integer
                        example: 2
        409:
          description: locked
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This application can no longer be edited.'
                properties:
                  message:
                    type: string
                    example: 'This application can no longer be edited.'
        422:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'unknown program'
                    type: object
                    example:
                      message: 'The selected program could not be found.'
                      errors:
                        primary_program_id:
