openapi: 3.0.3
info:
  title: 'PRS API Documentation'
  description: ''
  version: 1.0.0
servers:
  - url: 'http://localhost'
tags:
  - name: Endpoints
    description: ''
paths:
  /api/v1/health:
    get:
      summary: 'Service health check.'
      operationId: serviceHealthCheck
      description: "A public, unauthenticated liveness probe used by the SPA to confirm the\nAPI is reachable."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    status: ok
                    app: PRS
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      app:
                        type: string
                        example: PRS
      tags:
        - Endpoints
      security: []
  /api/v1/login:
    post:
      summary: 'Log in.'
      operationId: logIn
      description: "Authenticates via Sanctum's SPA cookie session (Q10)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Student Affairs'
                    email: r05@ejust.test
                    preferred_locale: en
                    roles:
                      -
                        code: R05
                        name: 'Student Affairs Staff'
                    permissions:
                      - documents.upload
                      - application.view_status
                      - application.screen
                      - interview.schedule
                      - courses.register_for_student
                      - registration.approve
                      - catalog.view
                      - grades.enter
                      - grades.view_student
                      - transcript.view_unofficial
                      - transcript.issue_official
                      - transcript.export
                      - standing.monitor
                      - calendar.manage
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Student Affairs'
                      email:
                        type: string
                        example: r05@ejust.test
                      preferred_locale:
                        type: string
                        example: en
                      roles:
                        type: array
                        example:
                          - code: R05
                            name: 'Student Affairs Staff'
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              example: R05
                            name:
                              type: string
                              example: 'Student Affairs Staff'
                      permissions:
                        type: array
                        example:
                          - documents.upload
                          - application.view_status
                          - application.screen
                          - interview.schedule
                          - courses.register_for_student
                          - registration.approve
                          - catalog.view
                          - grades.enter
                          - grades.view_student
                          - transcript.view_unofficial
                          - transcript.issue_official
                          - transcript.export
                          - standing.monitor
                          - calendar.manage
                        items:
                          type: string
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'These credentials do not match our records.'
                  errors:
                    email:
                      - 'These credentials do not match our records.'
                properties:
                  message:
                    type: string
                    example: 'These credentials do not match our records.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'These credentials do not match our records.'
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - email
                - password
      security: []
  /api/v1/logout:
    post:
      summary: 'Log out.'
      operationId: logOut
      description: 'Ends the session.'
      parameters: []
      responses:
        204:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example: {}
                properties: {}
      tags:
        - Endpoints
      security: []
  /api/v1/me:
    get:
      summary: 'Current user.'
      operationId: currentUser
      description: "The authenticated user + roles (and, from ticket 05, effective\npermissions); the SPA's authority source for route guards."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Student Affairs'
                    email: r05@ejust.test
                    preferred_locale: en
                    roles:
                      -
                        code: R05
                        name: 'Student Affairs Staff'
                    permissions:
                      - documents.upload
                      - application.view_status
                      - application.screen
                      - interview.schedule
                      - courses.register_for_student
                      - registration.approve
                      - catalog.view
                      - grades.enter
                      - grades.view_student
                      - transcript.view_unofficial
                      - transcript.issue_official
                      - transcript.export
                      - standing.monitor
                      - calendar.manage
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Student Affairs'
                      email:
                        type: string
                        example: r05@ejust.test
                      preferred_locale:
                        type: string
                        example: en
                      roles:
                        type: array
                        example:
                          - code: R05
                            name: 'Student Affairs Staff'
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              example: R05
                            name:
                              type: string
                              example: 'Student Affairs Staff'
                      permissions:
                        type: array
                        example:
                          - documents.upload
                          - application.view_status
                          - application.screen
                          - interview.schedule
                          - courses.register_for_student
                          - registration.approve
                          - catalog.view
                          - grades.enter
                          - grades.view_student
                          - transcript.view_unofficial
                          - transcript.issue_official
                          - transcript.export
                          - standing.monitor
                          - calendar.manage
                        items:
                          type: string
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
    patch:
      summary: 'Update current user.'
      operationId: updateCurrentUser
      description: "Persists the user's preferred UI language so the next session opens in it."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Student Affairs'
                    email: r05@ejust.test
                    preferred_locale: ar
                    roles:
                      -
                        code: R05
                        name: 'Student Affairs Staff'
                    permissions:
                      - catalog.view
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Student Affairs'
                      email:
                        type: string
                        example: r05@ejust.test
                      preferred_locale:
                        type: string
                        example: ar
                      roles:
                        type: array
                        example:
                          - code: R05
                            name: 'Student Affairs Staff'
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              example: R05
                            name:
                              type: string
                              example: 'Student Affairs Staff'
                      permissions:
                        type: array
                        example:
                          - catalog.view
                        items:
                          type: string
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The selected preferred locale is invalid.'
                  errors:
                    preferred_locale:
                      - 'The selected preferred locale is invalid.'
                properties:
                  message:
                    type: string
                    example: 'The selected preferred locale is invalid.'
                  errors:
                    type: object
                    properties:
                      preferred_locale:
                        type: array
                        example:
                          - 'The selected preferred locale is invalid.'
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preferred_locale:
                  type: string
                  description: 'The UI language (en or ar).'
                  example: ar
              required:
                - preferred_locale
      security: []
  /api/v1/demo/catalog-management:
    get:
      summary: 'Catalog management demo.'
      operationId: catalogManagementDemo
      description: "A permission-gated sample endpoint (the Phase 0 RBAC tracer): reachable\nonly by users whose effective permissions include `catalog.manage`\n(R06/R07 and admins). It proves API-side enforcement; later phases replace\nit with the real Catalog module."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    message: 'You can manage programs and courses.'
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'You can manage programs and courses.'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
      tags:
        - Endpoints
      security: []
