  '/api/v1/registration/enrollments/{enrollment_id}':
    delete:
      summary: 'Free-drop a course from the schedule (add/drop period).'
      operationId: freeDropACourseFromTheScheduleadddropPeriod
      description: "A direct drop during the add/drop window — the Enrollment is **hard-deleted**, leaving\nno trace (a drop is never a Course Status). Blocked when it would take the Student's\ncredit-hour load below the floor, unless the first-semester exception applies; the\nAdvisor is notified. Available only while the Semester is in its add/drop period (else\n409) and only to a Student with an approved Initial request for that Semester (else\n403); the Enrollment must be the acting Student's own (else 404). Gated on\n`courses.register_self`."
      parameters: []
      responses:
        204:
          description: dropped
          content:
            text/plain:
              schema:
                type: string
                example: ''
        403:
          description: 'no approved initial registration'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Free add/drop needs an approved initial registration for this semester.'
                properties:
                  message:
                    type: string
                    example: 'Free add/drop needs an approved initial registration for this semester.'
        409:
          description: 'outside the add/drop window'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The add/drop period is not open for this course.'
                properties:
                  message:
                    type: string
                    example: 'The add/drop period is not open for this course.'
        422:
          description: 'would fall below the credit-hour floor'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Dropping DEP501 would leave you below the 6-hour minimum load.'
                  errors:
                    below_min_credit_hours:
                      - 'Dropping DEP501 would leave you below the 6-hour minimum load.'
                properties:
                  message:
                    type: string
                    example: 'Dropping DEP501 would leave you below the 6-hour minimum load.'
                  errors:
                    type: object
                    properties:
                      below_min_credit_hours:
                        type: array
                        example:
                          - 'Dropping DEP501 would leave you below the 6-hour minimum load.'
                        items:
                          type: string
      tags:
        - Enrollment
      security: []
    parameters:
      -
        in: path
        name: enrollment_id
        description: "The Enrollment's id."
        example: 5
        required: true
        schema:
          type: integer
