  /api/v1/catalog/tree:
    get:
      summary: 'The catalog browse tree.'
      operationId: theCatalogBrowseTree
      description: "Faculties are ordered by code; within each Program the three Categories are\nalways present in bylaw order (Preparatory, Program Core, Research Elective)\nwith their required credit hours, and Courses within a Category follow the\ncurriculum ordinal (Course code as a stable tiebreak)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    faculties:
                      -
                        id: 1
                        code: FoE
                        name_en: 'Faculty of Engineering'
                        name_ar: 'كلية الهندسة'
                        is_active: true
                        departments:
                          -
                            id: 1
                            code: CE
                            name_en: 'Computer Engineering'
                            name_ar: 'هندسة الحاسوب'
                            is_active: true
                            programs:
                              -
                                id: 1
                                code: MSC-CE
                                name_en: 'MSc in Computer Engineering'
                                name_ar: 'ماجستير في هندسة الحاسوب'
                                degree_level: MSc
                                is_active: true
                                categories:
                                  -
                                    category: Preparatory
                                    required_ch: 6
                                    courses:
                                      - { id: 10, code: PRE401, name_en: 'English for Academic Purposes', name_ar: 'الإنجليزية للأغراض الأكاديمية', level: 400, is_active: true }
                properties:
                  data:
                    type: object
                    properties:
                      faculties:
                        type: array
                        example:
                          -
                            id: 1
                            code: FoE
                            name_en: 'Faculty of Engineering'
                            name_ar: 'كلية الهندسة'
                            is_active: true
                            departments:
                              -
                                id: 1
                                code: CE
                                name_en: 'Computer Engineering'
                                name_ar: 'هندسة الحاسوب'
                                is_active: true
                                programs:
                                  -
                                    id: 1
                                    code: MSC-CE
                                    name_en: 'MSc in Computer Engineering'
                                    name_ar: 'ماجستير في هندسة الحاسوب'
                                    degree_level: MSc
                                    is_active: true
                                    categories:
                                      - { category: Preparatory, required_ch: 6, courses: [{ id: 10, code: PRE401, name_en: 'English for Academic Purposes', name_ar: 'الإنجليزية للأغراض الأكاديمية', level: 400, is_active: true }] }
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            code:
                              type: string
                              example: FoE
                            name_en:
                              type: string
                              example: 'Faculty of Engineering'
                            name_ar:
                              type: string
                              example: 'كلية الهندسة'
                            is_active:
                              type: boolean
                              example: true
                            departments:
                              type: array
                              example:
                                -
                                  id: 1
                                  code: CE
                                  name_en: 'Computer Engineering'
                                  name_ar: 'هندسة الحاسوب'
                                  is_active: true
                                  programs:
                                    -
                                      id: 1
                                      code: MSC-CE
                                      name_en: 'MSc in Computer Engineering'
                                      name_ar: 'ماجستير في هندسة الحاسوب'
                                      degree_level: MSc
                                      is_active: true
                                      categories: [{ category: Preparatory, required_ch: 6, courses: [{ id: 10, code: PRE401, name_en: 'English for Academic Purposes', name_ar: 'الإنجليزية للأغراض الأكاديمية', level: 400, is_active: true }] }]
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    example: 1
                                  code:
                                    type: string
                                    example: CE
                                  name_en:
                                    type: string
                                    example: 'Computer Engineering'
                                  name_ar:
                                    type: string
                                    example: 'هندسة الحاسوب'
                                  is_active:
                                    type: boolean
                                    example: true
                                  programs:
                                    type: array
                                    example:
                                      - { id: 1, code: MSC-CE, name_en: 'MSc in Computer Engineering', name_ar: 'ماجستير في هندسة الحاسوب', degree_level: MSc, is_active: true, categories: [{ category: Preparatory, required_ch: 6, courses: [{ id: 10, code: PRE401, name_en: 'English for Academic Purposes', name_ar: 'الإنجليزية للأغراض الأكاديمية', level: 400, is_active: true }] }] }
                                    items:
                                      type: object
                                      properties: { id: { type: integer, example: 1 }, code: { type: string, example: MSC-CE }, name_en: { type: string, example: 'MSc in Computer Engineering' }, name_ar: { type: string, example: 'ماجستير في هندسة الحاسوب' }, degree_level: { type: string, example: MSc }, is_active: { type: boolean, example: true }, categories: { type: array, example: [{ category: Preparatory, required_ch: 6, courses: [{ id: 10, code: PRE401, name_en: 'English for Academic Purposes', name_ar: 'الإنجليزية للأغراض الأكاديمية', level: 400, is_active: true }] }], items: { type: object, properties: { category: { type: string, example: Preparatory }, required_ch: { type: integer, example: 6 }, courses: { type: array, example: [{ id: 10, code: PRE401, name_en: 'English for Academic Purposes', name_ar: 'الإنجليزية للأغراض الأكاديمية', level: 400, is_active: true }], items: { type: object, properties: { id: { type: integer, example: 10 }, code: { type: string, example: PRE401 }, name_en: { type: string, example: 'English for Academic Purposes' }, name_ar: { type: string, example: 'الإنجليزية للأغراض الأكاديمية' }, level: { type: integer, example: 400 }, is_active: { type: boolean, example: true } } } } } } } }
      tags:
        - Catalog
      security: []
  /api/v1/faculties:
    get:
      summary: 'List Faculties.'
      operationId: listFaculties
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
