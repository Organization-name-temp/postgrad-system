                    example: 'This action is unauthorized.'
        409:
          description: 'not decidable from current status'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This application cannot move from under_dean_review to accepted.'
                properties:
                  message:
                    type: string
                    example: 'This application cannot move from under_dean_review to accepted.'
        422:
          description: 'advisor is not an advisor'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The selected advisor must be an academic advisor.'
                  errors:
                    advisor_id:
                      - 'The selected advisor must be an academic advisor.'
                properties:
                  message:
                    type: string
                    example: 'The selected advisor must be an academic advisor.'
                  errors:
                    type: object
                    properties:
                      advisor_id:
                        type: array
