name: CI

on:
  push:
  pull_request:

# Thin CI (Q12): it just invokes the same gate scripts developers run locally.
# The scripts are the substance; this file wires them to run on push/PR.
jobs:
  backend:
    name: Backend gate (Pint, PHPStan, deptrac, Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: prs
          POSTGRES_USER: prs
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          coverage: none
      - name: Create test database
        env:
          PGPASSWORD: secret
        run: psql -h 127.0.0.1 -U prs -d prs -c 'CREATE DATABASE prs_test;'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer gate
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432

  frontend:
    name: Frontend checks (ESLint, Prettier, tsc, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:check
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm run test

  e2e:
    name: Playwright smoke (full stack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: prs
          POSTGRES_USER: prs
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env && php artisan key:generate
      - name: Set up frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright smoke
        working-directory: frontend
        run: npm run e2e
