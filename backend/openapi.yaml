  /api/v1/application/resend-verification:
    post:
      summary: 'Resend the verification link.'
      operationId: resendTheVerificationLink
      description: "Issues a fresh signed link for the signed-in applicant's Application (in\n`verification_url`, and logged), for recovering a missed one. Allowed only\nwhile the Application is awaiting verification (`submitted`), and throttled to\na few attempts per day (BR-72) — the sixth in a day is turned away with 429."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: submitted
                    admission_cycle_id: 1
                    name_en: 'Sara Applicant'
                  verification_url: 'http://localhost/api/v1/applications/1/verify-email?expires=1784000000&signature=abc123'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: submitted
                      admission_cycle_id:
                        type: integer
                        example: 1
                      name_en:
                        type: string
                        example: 'Sara Applicant'
                  verification_url:
                    type: string
                    example: 'http://localhost/api/v1/applications/1/verify-email?expires=1784000000&signature=abc123'
        409:
          description: 'not awaiting verification'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This application is not awaiting email verification.'
                properties:
                  message:
                    type: string
                    example: 'This application is not awaiting email verification.'
        429:
          description: throttled
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Too Many Attempts.'
                properties:
                  message:
                    type: string
                    example: 'Too Many Attempts.'
      tags:
        - Admissions
      security: []
  /api/v1/application/documents:
    post:
      summary: 'Upload a document.'
      operationId: uploadADocument
      description: "Validates the file against the chosen {@see DocumentType}'s rules — allowed\nformats, size ceiling, and how many of that type the application may hold —\nstores it on the private disk under a fresh ULID, and returns the created\ndocument. A bad type, wrong format, oversize file, or one copy too many is a\n422; uploading once the application has left the applicant's hands is a 409."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                    document_type: graduation_certificate
                    original_filename: certificate.pdf
                    mime: application/pdf
                    size_bytes: 24576
                    uploaded_at: '2026-07-14T10:00:00+00:00'
                    download_url: 'http://localhost/api/v1/documents/01ARZ3NDEKTSV4RRFFQ69G5FAV'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                      document_type:
                        type: string
                        example: graduation_certificate
                      original_filename:
                        type: string
                        example: certificate.pdf
                      mime:
                        type: string
                        example: application/pdf
                      size_bytes:
                        type: integer
                        example: 24576
                      uploaded_at:
                        type: string
                        example: '2026-07-14T10:00:00+00:00'
                      download_url:
                        type: string
                        example: 'http://localhost/api/v1/documents/01ARZ3NDEKTSV4RRFFQ69G5FAV'
        409:
          description: 'documents locked'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Documents can no longer be changed for this application.'
                properties:
                  message:
                    type: string
                    example: 'Documents can no longer be changed for this application.'
        422:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'over the cap'
                    type: object
                    example:
                      message: 'You can upload at most 1 document of this type.'
                      errors:
                        document_type:
                          - 'You can upload at most 1 document of this type.'
                    properties:
                      message:
                        type: string
                        example: 'You can upload at most 1 document of this type.'
                      errors:
                        type: object
                        properties:
                          document_type:
                            type: array
                            example:
                              - 'You can upload at most 1 document of this type.'
                            items:
                              type: string
                  -
                    description: 'bad file'
                    type: object
                    example:
                      message: 'The file must be a file of type: application/pdf, image/jpeg, image/png.'
                      errors:
                        file:
                          - 'The file must be a file of type: application/pdf, image/jpeg, image/png.'
                    properties:
                      message:
                        type: string
                        example: 'The file must be a file of type: application/pdf, image/jpeg, image/png.'
                      errors:
                        type: object
                        properties:
                          file:
                            type: array
                            example:
                              - 'The file must be a file of type: application/pdf, image/jpeg, image/png.'
                            items:
                              type: string
      tags:
        - Admissions
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document_type:
                  type: string
                  description: 'The kind of document. One of graduation_certificate, transcript, national_id, photo, english_certificate, msc_thesis, cv, recommendation_letter, additional_certificate.'
                  example: graduation_certificate
                file:
                  type: string
                  format: binary
                  description: "The file to upload (PDF or image, within the type's size limit)."
              required:
                - document_type
                - file
      security: []
  '/api/v1/application/documents/{document_ulid}':
    delete:
      summary: 'Remove a document.'
      operationId: removeADocument
      description: "Deletes the file (bytes and metadata) from the signed-in applicant's own\napplication, freeing its slot so a replacement can be uploaded. Allowed only\nwhile the application is still applicant-editable; a document that is not the\ncurrent applicant's is a 404, and a locked application is a 409."
      parameters: []
      responses:
        204:
          description: removed
          content:
            text/plain:
              schema:
                type: string
                example: ''
        404:
          description: 'not the applicant’s document'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Not found.'
                properties:
                  message:
                    type: string
                    example: 'Not found.'
        409:
          description: 'documents locked'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Documents can no longer be changed for this application.'
                properties:
                  message:
                    type: string
                    example: 'Documents can no longer be changed for this application.'
      tags:
        - Admissions
      security: []
    parameters:
      -
        in: path
        name: document_ulid
        description: 'The ULID of the document to remove.'
        example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
        required: true
        schema:
          type: string
  /api/v1/application/programs:
    patch:
      summary: 'Choose program(s).'
      operationId: choosePrograms
      description: "Validates and stores the applicant's primary and optional alternative Program.\nEach id must be a real Program; the primary's degree level must match the\n`applying_for_degree` from Step 1; and the applicant's previous degree must\nqualify them for each chosen Program's level. A bad id, a level mismatch, or an\nunqualified Program is a 422; selecting once the application has left the\napplicant's hands (finalized/in review) is a 409."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: email_verified
                    admission_cycle_id: 1
                    primary_program_id: 1
                    alternative_program_id: 2
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: email_verified
                      admission_cycle_id:
                        type: integer
                        example: 1
                      primary_program_id:
                        type: integer
                        example: 1
                      alternative_program_id:
                        type: integer
                        example: 2
        409:
          description: locked
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This application can no longer be edited.'
                properties:
                  message:
                    type: string
                    example: 'This application can no longer be edited.'
        422:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'unknown program'
                    type: object
                    example:
                      message: 'The selected program could not be found.'
                      errors:
                        primary_program_id:
                          - 'The selected program could not be found.'
                    properties:
                      message:
                        type: string
                        example: 'The selected program could not be found.'
                      errors:
                        type: object
                        properties:
                          primary_program_id:
                            type: array
                            example:
                              - 'The selected program could not be found.'
                            items:
                              type: string
                  -
                    description: 'not qualified'
                    type: object
                    example:
                      message: 'Your previous degree does not qualify you for this program.'
                      errors:
                        primary_program_id:
                          - 'Your previous degree does not qualify you for this program.'
                    properties:
                      message:
                        type: string
                        example: 'Your previous degree does not qualify you for this program.'
                      errors:
                        type: object
                        properties:
                          primary_program_id:
                            type: array
                            example:
                              - 'Your previous degree does not qualify you for this program.'
                            items:
                              type: string
      tags:
        - Admissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                primary_program_id:
                  type: integer
                  description: "The chosen primary Program's id."
                  example: 1
                alternative_program_id:
                  type: integer
                  description: "An optional second-choice Program's id; must differ from the primary."
                  example: 2
                  nullable: true
              required:
                - primary_program_id
      security: []
  /api/v1/application/finalize:
    post:
      summary: 'Finalize the application.'
      operationId: finalizeTheApplication
      description: "The last wizard step: moves a complete application from `email_verified` into\nStudent Affairs review (`under_sa_review`) and stamps `finalized_at`. A complete\napplication has a primary Program chosen (program-selection step) and every\nrequired and conditionally-required document uploaded (the English certificate\nif a test was reported, the MSc thesis for a PhD applicant). A missing\nprerequisite is a 422; finalizing anything not awaiting finalize (not\n`email_verified`) is a 409."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: under_sa_review
                    admission_cycle_id: 1
                    finalized_at: '2026-07-14T10:00:00+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: under_sa_review
                      admission_cycle_id:
                        type: integer
                        example: 1
                      finalized_at:
                        type: string
                        example: '2026-07-14T10:00:00+00:00'
        409:
          description: 'not ready to finalize'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This application is not ready to be finalized.'
                properties:
                  message:
                    type: string
                    example: 'This application is not ready to be finalized.'
        422:
          description: 'missing prerequisites'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Choose a program before finalizing your application.'
                  errors:
                    primary_program_id:
                      - 'Choose a program before finalizing your application.'
                    documents:
                      - 'Upload every required document before finalizing your application.'
                properties:
                  message:
                    type: string
                    example: 'Choose a program before finalizing your application.'
                  errors:
                    type: object
                    properties:
                      primary_program_id:
                        type: array
                        example:
                          - 'Choose a program before finalizing your application.'
                        items:
                          type: string
                      documents:
                        type: array
                        example:
                          - 'Upload every required document before finalizing your application.'
                        items:
                          type: string
      tags:
        - Admissions
      security: []
  /api/v1/application/resubmit:
    post:
      summary: 'Resubmit after revision.'
      operationId: resubmitAfterRevision
      description: "Sends a returned application back into Student Affairs review once the applicant\nhas addressed the reviewer's instructions (FR-ADM-005.3): `returned_for_revision`\n→ `under_sa_review`. Legal only from `returned_for_revision` (any other status is\na 409 — there is nothing to resubmit); and, like finalize, the application must\nstill be complete — a primary Program and every owed document — so an applicant\ncannot delete a required document and push an incomplete application back into\nreview (story 20's \"only complete applications reach review\" invariant, 422)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: under_sa_review
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: under_sa_review
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        409:
          description: 'nothing to resubmit'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This application has not been returned for revision.'
                properties:
                  message:
                    type: string
                    example: 'This application has not been returned for revision.'
        422:
          description: incomplete
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Upload every required document before finalizing your application.'
                  errors:
                    documents:
                      - 'Upload every required document before finalizing your application.'
                properties:
                  message:
                    type: string
                    example: 'Upload every required document before finalizing your application.'
                  errors:
                    type: object
                    properties:
                      documents:
                        type: array
                        example:
                          - 'Upload every required document before finalizing your application.'
                        items:
                          type: string
      tags:
