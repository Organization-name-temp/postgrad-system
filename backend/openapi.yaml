  /api/v1/me:
    get:
      summary: 'Current user.'
      operationId: currentUser
      description: "The authenticated user + roles (and, from ticket 05, effective\npermissions); the SPA's authority source for route guards. Once the user holds\nthe Student role (R02), `student` carries their `Student` anchor — University ID,\nprogram, enrollment term, advisor — so a newly-admitted user sees their student\nidentity on sign-in (ADR-0013); it is `null` for everyone who is not a Student."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 2
                    name: 'Sara Applicant'
                    email: sara@example.com
                    preferred_locale: en
                    roles:
                      -
                        code: R02
                        name: Student
                    permissions:
                      - courses.register_self
                      - exemption.submit
                      - transfer_waiver.submit
                      - grades.view_own
                      - transcript.view_unofficial
                      - transcript.export
                      - standing.monitor
                      - catalog.view
                    student:
                      university_id: 2026-MSC-CE-0001
                      program_id: 1
                      enrollment_term: 'Fall 2026'
                      admission_cycle_id: 1
                      advisor_id: 3
                      admitted_at: '2026-07-15T10:00:00+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: 'Sara Applicant'
                      email:
                        type: string
                        example: sara@example.com
                      preferred_locale:
                        type: string
                        example: en
                      roles:
                        type: array
                        example:
                          - code: R02
                            name: Student
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              example: R02
                            name:
                              type: string
                              example: Student
                      permissions:
                        type: array
                        example:
                          - courses.register_self
                          - exemption.submit
                          - transfer_waiver.submit
                          - grades.view_own
                          - transcript.view_unofficial
                          - transcript.export
                          - standing.monitor
                          - catalog.view
                        items:
                          type: string
                      student:
                        type: object
                        properties:
                          university_id:
                            type: string
                            example: 2026-MSC-CE-0001
                          program_id:
                            type: integer
                            example: 1
                          enrollment_term:
                            type: string
                            example: 'Fall 2026'
                          admission_cycle_id:
                            type: integer
                            example: 1
                          advisor_id:
                            type: integer
                            example: 3
                          admitted_at:
                            type: string
                            example: '2026-07-15T10:00:00+00:00'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
    patch:
      summary: 'Update current user.'
      operationId: updateCurrentUser
      description: "Persists the user's preferred UI language so the next session opens in it."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Student Affairs'
                    email: r05@ejust.test
                    preferred_locale: ar
                    roles:
                      -
                        code: R05
                        name: 'Student Affairs Staff'
                    permissions:
                      - catalog.view
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Student Affairs'
                      email:
                        type: string
                        example: r05@ejust.test
                      preferred_locale:
                        type: string
                        example: ar
                      roles:
                        type: array
                        example:
                          - code: R05
                            name: 'Student Affairs Staff'
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              example: R05
                            name:
                              type: string
                              example: 'Student Affairs Staff'
                      permissions:
                        type: array
                        example:
                          - catalog.view
                        items:
                          type: string
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The selected preferred locale is invalid.'
                  errors:
                    preferred_locale:
                      - 'The selected preferred locale is invalid.'
                properties:
                  message:
                    type: string
                    example: 'The selected preferred locale is invalid.'
                  errors:
                    type: object
                    properties:
                      preferred_locale:
                        type: array
                        example:
                          - 'The selected preferred locale is invalid.'
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preferred_locale:
