          description: 'not owner or reviewer'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
      tags:
        - Admissions
      security: []
    parameters:
      -
        in: path
        name: document_ulid
        description: 'The ULID of the document to stream.'
        example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
        required: true
        schema:
          type: string
