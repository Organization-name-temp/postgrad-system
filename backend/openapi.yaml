        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  description: 'One of accept, conditional, waitlist, reject.'
                  example: accept
                advisor_id:
                  type: integer
                  description: 'The advisor to assign on accept; defaults to the least-loaded advisor.'
                  example: 3
                  nullable: true
                conditions:
                  type: string
                  description: "when action is conditional. The offer's conditions."
                  example: 'Submit the final transcript by September.'
                  nullable: true
                waitlist_position:
                  type: integer
                  description: "when action is waitlist. The applicant's place."
                  example: 2
                  nullable: true
                note:
                  type: string
                  description: 'when action is reject. The reason.'
                  example: 'The panel did not recommend admission.'
                  nullable: true
              required:
                - action
                - conditions
                - waitlist_position
                - note
