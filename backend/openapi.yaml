              schema:
                oneOf:
                  -
                    description: 'approved for interview'
                    type: object
                    example:
                      data:
                        id: 1
                        status: interview_scheduled
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          status:
                            type: string
                            example: interview_scheduled
                  -
                    description: rejected
                    type: object
                    example:
                      data:
                        id: 1
                        status: rejected
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          status:
                            type: string
                            example: rejected
        403:
          description: 'out of faculty'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
        409:
          description: 'not under dean review'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This application cannot move from under_sa_review to interview_scheduled.'
