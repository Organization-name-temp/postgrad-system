# Enforces the modular-monolith seam (ADR-0002/0007): a module's Internal is
# private to that module; only its Public may be referenced from outside.
#
# Each module contributes a Public and an Internal layer. Catalog (Phase 1) is
# the first real cross-module edge: it may reach Identity through Identity\Public
# (the Permission/Role enums + Gates), but never Identity\Internal, and its own
# Internal is sealed from everyone else.
deptrac:
  paths:
    - ./app
    - ./modules
    - ./support
  layers:
    - name: Support
      collectors:
        - type: classLike
          value: '^Support\\.*'
    - name: App
      collectors:
        - type: classLike
          value: '^App\\.*'
    - name: Identity_Public
      collectors:
        - type: classLike
          value: '^Modules\\Identity\\Public\\.*'
    - name: Identity_Internal
      collectors:
        - type: classLike
          value: '^Modules\\Identity\\Internal\\.*'
    - name: Catalog_Public
      collectors:
        - type: classLike
          value: '^Modules\\Catalog\\Public\\.*'
    - name: Catalog_Internal
      collectors:
        - type: classLike
          value: '^Modules\\Catalog\\Internal\\.*'
    - name: Admissions_Public
      collectors:
        - type: classLike
          value: '^Modules\\Admissions\\Public\\.*'
    - name: Admissions_Internal
      collectors:
        - type: classLike
          value: '^Modules\\Admissions\\Internal\\.*'
    - name: Notifications_Public
      collectors:
        - type: classLike
          value: '^Modules\\Notifications\\Public\\.*'
    - name: Notifications_Internal
      collectors:
        - type: classLike
          value: '^Modules\\Notifications\\Internal\\.*'
    - name: Calendar_Public
      collectors:
        - type: classLike
          value: '^Modules\\Calendar\\Public\\.*'
    - name: Calendar_Internal
      collectors:
        - type: classLike
          value: '^Modules\\Calendar\\Internal\\.*'
    - name: Enrollment_Public
      collectors:
        - type: classLike
          value: '^Modules\\Enrollment\\Public\\.*'
    - name: Enrollment_Internal
      collectors:
        - type: classLike
          value: '^Modules\\Enrollment\\Internal\\.*'
    - name: Grading_Public
      collectors:
        - type: classLike
          value: '^Modules\\Grading\\Public\\.*'
    - name: Grading_Internal
      collectors:
        - type: classLike
          value: '^Modules\\Grading\\Internal\\.*'
    - name: AcademicStanding_Public
      collectors:
        - type: classLike
          value: '^Modules\\AcademicStanding\\Public\\.*'
    - name: AcademicStanding_Internal
      collectors:
        - type: classLike
          value: '^Modules\\AcademicStanding\\Internal\\.*'
    - name: Records_Public
      collectors:
        - type: classLike
          value: '^Modules\\Records\\Public\\.*'
    - name: Records_Internal
      collectors:
        - type: classLike
          value: '^Modules\\Records\\Internal\\.*'
  ruleset:
    # The app may orchestrate modules only through their Public facades.
    App:
      - Identity_Public
      - Catalog_Public
      - Calendar_Public
      - Enrollment_Public
      - Grading_Public
      - AcademicStanding_Public
    # A module's own Public facade may use its own Internal, and vice versa.
    Identity_Public:
      - Identity_Internal
      - Support
    Identity_Internal:
      - Admissions_Public
      - Identity_Public
      - Support
    # Catalog may reach Identity only through Identity\Public (never Internal).
    Catalog_Public:
      - Catalog_Internal
      - Identity_Public
    Catalog_Internal:
      - Catalog_Public
      - Identity_Public
      - Support
    # Admissions (Phase 2) is the first module with multiple cross-module edges.
    # Ticket 01 opened the Identity\Public edge (calendar.manage lives in the §3.2
    # matrix); ticket 06 opens the Catalog\Public edge (program selection reads the
    # ProgramCatalog facade + DegreeLevel, ADR-0012); ticket 07 opens the
    # Notifications\Public edge (screening return/reject enqueue a notification).
    Admissions_Public:
      - Admissions_Internal
      - Identity_Public
    Admissions_Internal:
      - Admissions_Public
      - Identity_Public
      - Catalog_Public
      - Notifications_Public
      - Support
    # Notifications (Phase 2, ticket 02) is cross-cutting: any module may enqueue a
    # notification through Notifications\Public, but Notifications itself reaches
    # only Identity\Public (user ids) and never any other module. The inbound edges
    # (Admissions → Notifications\Public, App → Notifications\Public) are opened by
    # the tickets that first consume them.
    Notifications_Public:
      - Notifications_Internal
      - Identity_Public
    Notifications_Internal:
      - Notifications_Public
      - Identity_Public
      - Support
    # Calendar (Phase 3, ADR-0018) is a supporting module: it owns the Semester and
    # its period windows and depends on no other domain module. Its Public read
    # facade (AcademicCalendar + SemesterSummary) is the only seam consumers touch;
    # the SemesterSummary DTO delegates its period answers to the pure Internal
    # SemesterCalendar (a same-module Public → Internal reference, the Admissions
    # precedent). Inbound edges from Enrollment arrive with that module.
    Calendar_Public:
      - Calendar_Internal
    Calendar_Internal:
      - Calendar_Public
      - Support
    # Enrollment (Phase 3, ADR-0017) is the domain module course registration hangs
    # off. Ticket 03 opens its first edges: it reads the Semester through Calendar\Public
    # (offerings belong to a Semester), the Course through Catalog\Public (the new
    # CourseCatalog facade, ADR-0012), and the Instructor through Identity\Public (the
    # R04 picker). The Notifications\Public edge is declared now for the registration
    # loop that later tickets build (ADR-0017). Enrollment\Public ships empty beyond its
    # routes, which point at the Internal controller (a same-module Public → Internal
    # reference, the Calendar precedent).
    Enrollment_Public:
      - Enrollment_Internal
    Enrollment_Internal:
      - Enrollment_Public
      - Admissions_Public
      - Identity_Public
      - Catalog_Public
      - Calendar_Public
      - Notifications_Public
      - Support
    # Grading (Phase 4, ADR-0020) owns the Grade, the Grade Sheet and — from ticket 04 —
    # the GPA/CGPA read model. Ticket 01 opened its first edges: it reads the roster and the
    # Offering's routing facts through the newly-shipped Enrollment\Public facade (ADR-0017's
    # deferred surface, ADR-0012), the Course through Catalog\Public, and the Student's
    # identity through Identity\Public. The dependency runs ONE WAY, Grading → Enrollment
    # (ADR-0022): Enrollment never reads Grading, so there is no Public↔Public cycle to permit
    # and Enrollment's registration gates stay pure functions over its own rows. Ticket 03 opened
    # the Notifications\Public edge (sheet-submitted/returned/finalized); ticket 04 opens
    # Calendar\Public — the GPA/CGPA read model orders a Course's Attempts by their Semester's
    # `starts_at` (ADR-0018), so it resolves the Semester through the same facade Enrollment
    # already reads. Grading\Public holds only the route bindings, which point at the Internal
    # controller (a same-module Public → Internal reference, the Calendar precedent).
    Grading_Public:
      - Grading_Internal
    Grading_Internal:
      - Grading_Public
      - Identity_Public
      - Catalog_Public
      - Calendar_Public
      - Enrollment_Public
      - Notifications_Public
      - Support
    AcademicStanding_Public:
      - AcademicStanding_Internal
    AcademicStanding_Internal:
      - AcademicStanding_Public
      - Identity_Public
      - Catalog_Public
      - Calendar_Public
      - Enrollment_Public
      - Grading_Public
      - Notifications_Public
      - Support
    # No rule grants anyone access to another module's *_Internal — that is the seam.
    Records_Public:
      - Records_Internal
    Records_Internal:
      - Records_Public
      - Identity_Public
      - Catalog_Public
      - Calendar_Public
      - Enrollment_Public
      - Grading_Public
      - AcademicStanding_Public
      - Notifications_Public
      - Support
