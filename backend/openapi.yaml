  /api/v1/registration/enrollments:
    post:
      summary: 'Free-add a course to the schedule (add/drop period).'
      operationId: freeAddACourseToTheScheduleadddropPeriod
      description: "A direct add during the add/drop window, no advisor approval — the Advisor is notified.\nThe Offering must be eligible for the Student and **not** an External Elective (those\nneed a registration request, BR-24); the whole schedule is re-validated (credit-hour\nceiling counting the existing load, seat capacity, time clash, the composition caps,\nand the derived-Retake cap of one). Available only while the Semester is in its\nadd/drop period (else 409) and only to a Student with an approved Initial request for\nthat Semester (else 403). Gated on `courses.register_self`."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 5
                    offering_id: 1
                    course_status: Regular
                    classification: Core
                    credit_hours: 3
                    course:
                      id: 1
                      code: DEP501
                      name_en: 'Advanced Algorithms'
                      name_ar: 'خوارزميات متقدمة'
                      level: 500
                      total_ch: 3
                      research_type: null
                      is_active: true
                    instructor:
                      id: 4
                      name: 'Dr. Instructor'
                      email: instructor@ejust.test
                    meetings:
                      -
                        weekday: 1
                        starts_at: '09:00'
                        ends_at: '11:00'
                    attendance:
                      present: 0
                      recorded: 0
                      percentage: 0
                      at_risk: false
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      offering_id:
                        type: integer
                        example: 1
                      course_status:
                        type: string
                        example: Regular
                      classification:
                        type: string
                        example: Core
                      credit_hours:
                        type: integer
                        example: 3
                      course:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          code:
                            type: string
                            example: DEP501
                          name_en:
                            type: string
                            example: 'Advanced Algorithms'
                          name_ar:
                            type: string
                            example: 'خوارزميات متقدمة'
                          level:
                            type: integer
                            example: 500
                          total_ch:
                            type: integer
                            example: 3
                          research_type:
                            type: string
                            example: null
                            nullable: true
                          is_active:
                            type: boolean
                            example: true
                      instructor:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 4
                          name:
                            type: string
                            example: 'Dr. Instructor'
                          email:
                            type: string
                            example: instructor@ejust.test
                      meetings:
                        type: array
                        example:
                          - weekday: 1
                            starts_at: '09:00'
                            ends_at: '11:00'
                        items:
                          type: object
                          properties:
                            weekday:
                              type: integer
                              example: 1
                            starts_at:
                              type: string
                              example: '09:00'
                            ends_at:
                              type: string
                              example: '11:00'
                      attendance:
                        type: object
                        properties:
                          present:
                            type: integer
                            example: 0
                          recorded:
                            type: integer
                            example: 0
                          percentage:
                            type: integer
                            example: 0
                          at_risk:
                            type: boolean
                            example: false
        403:
          description: 'no approved initial registration'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Free add/drop needs an approved initial registration for this semester.'
                properties:
                  message:
                    type: string
                    example: 'Free add/drop needs an approved initial registration for this semester.'
        409:
          description: 'outside the add/drop window'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The add/drop period is not open for this course.'
                properties:
                  message:
                    type: string
                    example: 'The add/drop period is not open for this course.'
        422:
          description: 'external elective'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'An external elective can only be added through a registration request.'
                  errors:
                    offering_id:
                      - 'An external elective can only be added through a registration request.'
                properties:
                  message:
                    type: string
                    example: 'An external elective can only be added through a registration request.'
                  errors:
                    type: object
                    properties:
                      offering_id:
                        type: array
                        example:
                          - 'An external elective can only be added through a registration request.'
                        items:
                          type: string
      tags:
        - Enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                offering_id:
                  type: integer
                  description: "An eligible Course Offering's id."
                  example: 1
