                        derived_retake: false
                        classification: Core
                        total_ch: 3
                        course:
                          id: 1
                          code: DEP501
                          name_en: 'Advanced Algorithms'
                          name_ar: 'خوارزميات متقدمة'
                          level: 500
                          total_ch: 3
                          research_type: null
                          is_active: true
                        instructor:
                          id: 4
                          name: 'Dr. Instructor'
                          email: instructor@ejust.test
                        meetings:
                          -
                            weekday: 1
                            starts_at: '09:00'
                            ends_at: '11:00'
