  '/api/v1/registration/requests/{registration_id}/decision':
    post:
      summary: "Record the Advisor's line-item decision."
      operationId: recordTheAdvisorsLineItemDecision
      description: "Approve or reject each line and attach an optional note. The approved subset is\nre-validated at decision time — credit-hour floor (waived in the Student's first\nsemester) and ceiling, composition caps and duplicate/clash against the Student's\nexisting Enrollments, seat capacity, and the derived-Retake cap of one — and, if\nclean, **one Enrollment is minted per approved line atomically**. ≥1 approved line ⇒\nthe request is Approved; all rejected ⇒ Rejected. The request must still be Pending\n(else 409) and, for an Advisor, belong to one of their advisees (else 403). Gated on\n`registration.approve`.\n\nA System/Super Administrator (R09/R10) may decide **any** advisor's advisee's request\n(the advisee-scope override, ADR-0015); that decision is attributed to the admin in the\nAudit Log, so an approval or rejection authored by someone other than the Student's\nAdvisor is accountable. The real Advisor deciding their own advisee stays un-audited."
      parameters: []
      responses:
        200:
          description: 'approved (Enrollments minted)'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    semester_id: 1
                    kind: Initial
                    status: Approved
                    advisor_note: 'Looks good.'
                    decided_at: '2026-08-03T09:00:00+00:00'
                    submitted_at: '2026-08-02T09:00:00+00:00'
                    lines:
