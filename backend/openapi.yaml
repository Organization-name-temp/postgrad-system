openapi: 3.0.3
info:
  title: 'PRS API Documentation'
  description: ''
  version: 1.0.0
servers:
  - url: 'http://localhost'
tags:
  - name: Administration
    description: "\nThe Dean↔Faculty assignment admin surface (ticket 08) — the system's first\n**role-gated** surface. Every endpoint sits behind the `admin` middleware, so\nonly a System/Super Administrator (R09/R10) may read or change the mapping;\nordinary staff — even a Dean — get a 403 (BR-75). No new permission is invented\nfor this (ADR-0008 intact): admin org-routing is a role concern, not a §3.2\nmatrix function.\n\nAn administrator lists the current assignments, picks a Dean (an R07 user) and a\nFaculty (opaque Catalog id, no FK — ADR-0012) to assign, or removes a row. The\nDean review queue (Admissions) reads the resulting mapping through the\nIdentity\\Public DeanAssignments facade."
  - name: Admissions
    description: "\nManage Admission Cycles — the windowed Fall/Spring intake (e.g. \"Fall 2026\")\nevery Application hangs off. Listing/creating/editing/activating requires the\ncalendar.manage permission (Student Affairs or a Dean). A Cycle is \"open\" when\nit is active and the current moment falls inside its window — derived, never a\nstored status column (ADR-0012, ticket 01). Cycles are deactivated, never\ndeleted. The {@see self::open()} lookup is public — it feeds the\nunauthenticated registration screen."
  - name: Catalog
    description: "\nThe catalog browse tree — the whole academic hierarchy (Faculty → Department →\nProgram → Category → Course) in a single read-model payload so the front end can\nrender and search it client-side without chatty per-node requests (FR-PCM-002,\nspec §API). Every node carries both language names; Course nodes carry their\nactive status so retired courses read accessibly. Reading requires catalog.view —\nthe catalog is universally browsable (ADR-0008). \"University\" is a synthetic root\nthe SPA prepends; it is not an entity, so it is not in this payload."
  - name: Endpoints
    description: ''
  - name: Notifications
    description: "\nA signed-in user's own in-app notifications — the data behind the shell's bell\n(ticket 02). Every endpoint is scoped to the authenticated user by\n{@see Notification::scopeForUser()}, so no request can list, count, or mutate\nanother user's notifications (a foreign id simply is not found → 404). Content\nis a type + payload; the SPA renders it bilingually, so nothing here is\nlocalised server-side."
paths:
  /api/v1/admin/deans:
    get:
      summary: 'List assignable Deans.'
      operationId: listAssignableDeans
      description: "The R07 (Dean) users an administrator may assign to a Faculty — the source for\nthe assignment screen's Dean picker. Admin-only (R09/R10)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 7
                      name: 'Dr. Dean of Engineering'
                      email: dean.eng@ejust.edu.eg
                properties:
                  data:
                    type: array
                    example:
                      - id: 7
                        name: 'Dr. Dean of Engineering'
                        email: dean.eng@ejust.edu.eg
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 7
                        name:
                          type: string
                          example: 'Dr. Dean of Engineering'
                        email:
                          type: string
                          example: dean.eng@ejust.edu.eg
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
      tags:
        - Administration
      security: []
  /api/v1/admin/faculty-dean-assignments:
    get:
      summary: 'List Dean↔Faculty assignments.'
      operationId: listDeanFacultyAssignments
      description: "Every current assignment with the assigned Dean's identity and the opaque\nFaculty id. Admin-only (R09/R10)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      user_id: 7
                      faculty_id: 3
                      dean_name: 'Dr. Dean of Engineering'
                      dean_email: dean.eng@ejust.edu.eg
                properties:
                  data:
                    type: array
                    example:
                      - id: 1
                        user_id: 7
                        faculty_id: 3
                        dean_name: 'Dr. Dean of Engineering'
                        dean_email: dean.eng@ejust.edu.eg
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        user_id:
                          type: integer
                          example: 7
                        faculty_id:
                          type: integer
                          example: 3
                        dean_name:
                          type: string
                          example: 'Dr. Dean of Engineering'
                        dean_email:
                          type: string
                          example: dean.eng@ejust.edu.eg
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
      tags:
        - Administration
      security: []
    post:
      summary: 'Assign a Dean to a Faculty.'
      operationId: assignADeanToAFaculty
      description: "Creates one Dean↔Faculty routing row. The user must hold the Dean role (R07)\nand the (Dean, Faculty) pair must not already exist — either fails validation\n(422). Admin-only (R09/R10)."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    user_id: 7
                    faculty_id: 3
                    dean_name: 'Dr. Dean of Engineering'
                    dean_email: dean.eng@ejust.edu.eg
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      user_id:
                        type: integer
                        example: 7
                      faculty_id:
                        type: integer
                        example: 3
                      dean_name:
                        type: string
                        example: 'Dr. Dean of Engineering'
                      dean_email:
                        type: string
                        example: dean.eng@ejust.edu.eg
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
        422:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'not a Dean'
                    type: object
                    example:
                      message: 'The selected user is not a Dean.'
                      errors:
                        user_id:
                          - 'The selected user is not a Dean.'
                    properties:
                      message:
                        type: string
                        example: 'The selected user is not a Dean.'
                      errors:
                        type: object
                        properties:
                          user_id:
                            type: array
                            example:
                              - 'The selected user is not a Dean.'
                            items:
                              type: string
                  -
                    description: 'already assigned'
                    type: object
                    example:
                      message: 'This Dean is already assigned to that faculty.'
                      errors:
                        faculty_id:
                          - 'This Dean is already assigned to that faculty.'
                    properties:
                      message:
                        type: string
                        example: 'This Dean is already assigned to that faculty.'
                      errors:
                        type: object
                        properties:
                          faculty_id:
                            type: array
                            example:
                              - 'This Dean is already assigned to that faculty.'
                            items:
                              type: string
      tags:
        - Administration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: 'The Dean (R07 user) to assign.'
                  example: 7
                faculty_id:
                  type: integer
                  description: 'The opaque Catalog Faculty id.'
                  example: 3
              required:
                - user_id
                - faculty_id
      security: []
  '/api/v1/admin/faculty-dean-assignments/{assignment_id}':
    delete:
      summary: 'Unassign a Dean from a Faculty.'
      operationId: unassignADeanFromAFaculty
      description: 'Removes one routing row. Admin-only (R09/R10).'
      parameters: []
      responses:
        204:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example: {}
                properties: {}
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model.'
                properties:
                  message:
                    type: string
                    example: 'No query results for model.'
      tags:
        - Administration
      security: []
    parameters:
      -
        in: path
        name: assignment_id
        description: 'The assignment row id.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/admission-cycles/open:
    get:
      summary: 'List currently-open Admission Cycles.'
      operationId: listCurrentlyOpenAdmissionCycles
      description: "Public, unauthenticated: the front door the registration screen reads to\nknow whether (and into which intake) a stranger may apply. Returns only\nCycles that are active and whose window contains the current moment."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      intake_term: Fall
                      year: 2026
                      name_en: 'Fall 2026'
                      name_ar: 'خريف 2026'
                      opens_at: '2026-06-01T00:00:00+00:00'
                      closes_at: '2026-08-01T00:00:00+00:00'
                      is_active: true
                      is_open: true
                properties:
                  data:
                    type: array
                    example:
                      - id: 1
                        intake_term: Fall
                        year: 2026
                        name_en: 'Fall 2026'
                        name_ar: 'خريف 2026'
                        opens_at: '2026-06-01T00:00:00+00:00'
                        closes_at: '2026-08-01T00:00:00+00:00'
                        is_active: true
                        is_open: true
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        intake_term:
                          type: string
                          example: Fall
                        year:
                          type: integer
                          example: 2026
                        name_en:
                          type: string
                          example: 'Fall 2026'
                        name_ar:
                          type: string
                          example: 'خريف 2026'
                        opens_at:
                          type: string
                          example: '2026-06-01T00:00:00+00:00'
                        closes_at:
                          type: string
                          example: '2026-08-01T00:00:00+00:00'
                        is_active:
                          type: boolean
                          example: true
                        is_open:
                          type: boolean
                          example: true
      tags:
        - Admissions
      security: []
  /api/v1/register:
    post:
      summary: 'Register and start an application.'
      operationId: registerAndStartAnApplication
      description: "Open only while an Admission Cycle's window is open: refused when none is\nopen, auto-filed into the one open Cycle, or (when several are open) filed\ninto the chosen one. Rate-limited per client. On success the applicant is\nauthenticated and their Draft Application is returned."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: draft
                    admission_cycle_id: 1
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: draft
                      admission_cycle_id:
                        type: integer
                        example: 1
        409:
          description: 'admissions closed'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Admissions are currently closed.'
                properties:
                  message:
                    type: string
                    example: 'Admissions are currently closed.'
        422:
          description: validation
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The email has already been taken.'
                  errors:
                    email:
                      - 'The email has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The email has already been taken.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
      tags:
        - Admissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "The applicant's full name."
                  example: 'Sara Applicant'
                email:
                  type: string
                  description: 'A unique email address; becomes the login.'
                  example: sara@example.com
                password:
                  type: string
                  description: 'At least 8 characters; must match the confirmation.'
                  example: correct-horse
                password_confirmation:
                  type: string
                  description: 'Repeat of the password.'
                  example: correct-horse
                admission_cycle_id:
                  type: integer
                  description: 'The open Cycle to apply to. Required only when more than one Cycle is open; otherwise the single open Cycle is used.'
                  example: 1
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  '/api/v1/applications/{application_id}/verify-email':
    get:
      summary: 'Verify email (signed link).'
      operationId: verifyEmailsignedLink
      description: "The signed, expiring link the applicant received on submitting Step 1. A\nvalid signature marks their email verified and moves a `submitted`\nApplication to `email_verified`; re-clicking is idempotent. Tampered or\nexpired links are refused (403) by the `signed` middleware."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: email_verified
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: email_verified
        403:
          description: 'bad signature'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid signature.'
                properties:
                  message:
                    type: string
                    example: 'Invalid signature.'
      tags:
        - Admissions
      security: []
    parameters:
      -
        in: path
        name: application_id
        description: 'The ID of the application the link verifies.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/application:
    get:
      summary: 'My application.'
      operationId: myApplication
      description: "The signed-in applicant's current Application — its status and the whole\nStep-1 snapshot (fields the applicant has not yet provided come back null),\nso the SPA can render and resume the wizard at the right step."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: email_verified
                    admission_cycle_id: 1
                    name_en: 'Sara Applicant'
                    name_ar: 'سارة المتقدمة'
                    national_id: '29001010101010'
                    id_type: national_id
                    phone: '+201000000000'
                    date_of_birth: '1998-05-20'
                    nationality: EG
                    gender: Female
                    address_country: Egypt
                    address_city: Alexandria
                    address_street: '15 Corniche Road'
                    previous_university: 'Cairo University'
                    graduation_certificate_name: 'BSc in Computer Science'
                    graduation_date: '2020-07-01'
                    previous_degree: BSc
                    previous_major: 'Computer Science'
                    graduation_gpa: '3.50'
                    graduation_cgpa: '3.45'
                    gpa_scale: '4.0'
                    is_ejust_graduate: false
                    applying_for_degree: MSc
                    english_test: IELTS
                    english_score: '7.50'
                    native_arabic_speaker: true
                    submitted_at: '2026-07-14T10:00:00+00:00'
                    primary_program_id: 1
                    alternative_program_id: 2
                    primary_program:
                      id: 1
                      code: MSC-CE
                      name_en: 'MSc in Computer Engineering'
                      name_ar: 'ماجستير هندسة الحاسوب'
                      degree_level: MSc
                      department_name_en: 'Computer Engineering'
                      department_name_ar: 'هندسة الحاسوب'
                      faculty_name_en: 'Faculty of Engineering'
                      faculty_name_ar: 'كلية الهندسة'
                    alternative_program:
                      id: 2
                      code: MSC-EE
                      name_en: 'MSc in Electrical Engineering'
                      name_ar: 'ماجستير الهندسة الكهربية'
                      degree_level: MSc
                      department_name_en: 'Electrical Engineering'
                      department_name_ar: 'الهندسة الكهربية'
                      faculty_name_en: 'Faculty of Engineering'
                      faculty_name_ar: 'كلية الهندسة'
                    finalized_at: null
                    documents:
                      -
                        id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                        document_type: graduation_certificate
                        original_filename: certificate.pdf
                        mime: application/pdf
                        size_bytes: 24576
                        uploaded_at: '2026-07-14T10:00:00+00:00'
                        download_url: 'http://localhost/api/v1/documents/01ARZ3NDEKTSV4RRFFQ69G5FAV'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: email_verified
                      admission_cycle_id:
                        type: integer
                        example: 1
                      name_en:
                        type: string
                        example: 'Sara Applicant'
                      name_ar:
                        type: string
                        example: 'سارة المتقدمة'
                      national_id:
                        type: string
                        example: '29001010101010'
                      id_type:
                        type: string
                        example: national_id
                      phone:
                        type: string
                        example: '+201000000000'
                      date_of_birth:
                        type: string
                        example: '1998-05-20'
                      nationality:
                        type: string
                        example: EG
                      gender:
                        type: string
                        example: Female
                      address_country:
                        type: string
                        example: Egypt
                      address_city:
                        type: string
                        example: Alexandria
                      address_street:
                        type: string
                        example: '15 Corniche Road'
                      previous_university:
                        type: string
                        example: 'Cairo University'
                      graduation_certificate_name:
                        type: string
                        example: 'BSc in Computer Science'
                      graduation_date:
                        type: string
                        example: '2020-07-01'
                      previous_degree:
                        type: string
                        example: BSc
                      previous_major:
                        type: string
                        example: 'Computer Science'
                      graduation_gpa:
                        type: string
                        example: '3.50'
                      graduation_cgpa:
                        type: string
                        example: '3.45'
                      gpa_scale:
                        type: string
                        example: '4.0'
                      is_ejust_graduate:
                        type: boolean
                        example: false
                      applying_for_degree:
                        type: string
                        example: MSc
                      english_test:
                        type: string
                        example: IELTS
                      english_score:
                        type: string
                        example: '7.50'
                      native_arabic_speaker:
                        type: boolean
                        example: true
                      submitted_at:
                        type: string
                        example: '2026-07-14T10:00:00+00:00'
                      primary_program_id:
                        type: integer
                        example: 1
                      alternative_program_id:
                        type: integer
                        example: 2
                      primary_program:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          code:
                            type: string
                            example: MSC-CE
                          name_en:
                            type: string
                            example: 'MSc in Computer Engineering'
                          name_ar:
                            type: string
                            example: 'ماجستير هندسة الحاسوب'
                          degree_level:
                            type: string
                            example: MSc
                          department_name_en:
                            type: string
                            example: 'Computer Engineering'
                          department_name_ar:
                            type: string
                            example: 'هندسة الحاسوب'
                          faculty_name_en:
                            type: string
                            example: 'Faculty of Engineering'
                          faculty_name_ar:
                            type: string
                            example: 'كلية الهندسة'
                      alternative_program:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 2
                          code:
                            type: string
                            example: MSC-EE
                          name_en:
                            type: string
                            example: 'MSc in Electrical Engineering'
                          name_ar:
                            type: string
