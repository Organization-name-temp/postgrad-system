# Enforces the modular-monolith seam (ADR-0002/0007): a module's Internal is
# private to that module; only its Public may be referenced from outside.
#
# Each module contributes a Public and an Internal layer. Catalog (Phase 1) is
# the first real cross-module edge: it may reach Identity through Identity\Public
# (the Permission/Role enums + Gates), but never Identity\Internal, and its own
# Internal is sealed from everyone else.
deptrac:
  paths:
    - ./app
    - ./modules
  layers:
    - name: App
      collectors:
        - type: classLike
          value: '^App\\.*'
    - name: Identity_Public
      collectors:
        - type: classLike
          value: '^Modules\\Identity\\Public\\.*'
    - name: Identity_Internal
      collectors:
        - type: classLike
          value: '^Modules\\Identity\\Internal\\.*'
    - name: Catalog_Public
      collectors:
        - type: classLike
          value: '^Modules\\Catalog\\Public\\.*'
    - name: Catalog_Internal
      collectors:
        - type: classLike
          value: '^Modules\\Catalog\\Internal\\.*'
    - name: Admissions_Public
      collectors:
        - type: classLike
          value: '^Modules\\Admissions\\Public\\.*'
    - name: Admissions_Internal
      collectors:
        - type: classLike
          value: '^Modules\\Admissions\\Internal\\.*'
  ruleset:
    # The app may orchestrate modules only through their Public facades.
    App:
      - Identity_Public
      - Catalog_Public
    # A module's own Public facade may use its own Internal, and vice versa.
    Identity_Public:
      - Identity_Internal
    Identity_Internal:
      - Identity_Public
    # Catalog may reach Identity only through Identity\Public (never Internal).
    Catalog_Public:
      - Catalog_Internal
      - Identity_Public
    Catalog_Internal:
      - Catalog_Public
      - Identity_Public
    # Admissions (Phase 2) is the first module with multiple cross-module edges.
    # Ticket 01 opens only the Identity\Public edge (calendar.manage lives in the
    # §3.2 matrix); the Catalog\Public and Notifications\Public edges are added by
    # the tickets that first consume them (program selection, notifications).
    Admissions_Public:
      - Admissions_Internal
      - Identity_Public
    Admissions_Internal:
      - Admissions_Public
      - Identity_Public
    # No rule grants anyone access to another module's *_Internal — that is the seam.
