openapi: 3.0.3
info:
  title: 'PRS API Documentation'
  description: ''
  version: 1.0.0
servers:
  - url: 'http://localhost'
tags:
  - name: Admissions
    description: "\nManage Admission Cycles — the windowed Fall/Spring intake (e.g. \"Fall 2026\")\nevery Application hangs off. Listing/creating/editing/activating requires the\ncalendar.manage permission (Student Affairs or a Dean). A Cycle is \"open\" when\nit is active and the current moment falls inside its window — derived, never a\nstored status column (ADR-0012, ticket 01). Cycles are deactivated, never\ndeleted. The {@see self::open()} lookup is public — it feeds the\nunauthenticated registration screen."
  - name: Catalog
    description: "\nThe catalog browse tree — the whole academic hierarchy (Faculty → Department →\nProgram → Category → Course) in a single read-model payload so the front end can\nrender and search it client-side without chatty per-node requests (FR-PCM-002,\nspec §API). Every node carries both language names; Course nodes carry their\nactive status so retired courses read accessibly. Reading requires catalog.view —\nthe catalog is universally browsable (ADR-0008). \"University\" is a synthetic root\nthe SPA prepends; it is not an entity, so it is not in this payload."
  - name: Endpoints
    description: ''
  - name: Notifications
    description: "\nA signed-in user's own in-app notifications — the data behind the shell's bell\n(ticket 02). Every endpoint is scoped to the authenticated user by\n{@see Notification::scopeForUser()}, so no request can list, count, or mutate\nanother user's notifications (a foreign id simply is not found → 404). Content\nis a type + payload; the SPA renders it bilingually, so nothing here is\nlocalised server-side."
paths:
  /api/v1/admission-cycles/open:
    get:
      summary: 'List currently-open Admission Cycles.'
      operationId: listCurrentlyOpenAdmissionCycles
      description: "Public, unauthenticated: the front door the registration screen reads to\nknow whether (and into which intake) a stranger may apply. Returns only\nCycles that are active and whose window contains the current moment."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      intake_term: Fall
                      year: 2026
                      name_en: 'Fall 2026'
                      name_ar: 'خريف 2026'
                      opens_at: '2026-06-01T00:00:00+00:00'
                      closes_at: '2026-08-01T00:00:00+00:00'
                      is_active: true
                      is_open: true
                properties:
                  data:
                    type: array
                    example:
                      - id: 1
                        intake_term: Fall
                        year: 2026
                        name_en: 'Fall 2026'
                        name_ar: 'خريف 2026'
                        opens_at: '2026-06-01T00:00:00+00:00'
                        closes_at: '2026-08-01T00:00:00+00:00'
                        is_active: true
                        is_open: true
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        intake_term:
                          type: string
                          example: Fall
                        year:
                          type: integer
                          example: 2026
                        name_en:
                          type: string
                          example: 'Fall 2026'
                        name_ar:
                          type: string
                          example: 'خريف 2026'
                        opens_at:
                          type: string
                          example: '2026-06-01T00:00:00+00:00'
                        closes_at:
                          type: string
                          example: '2026-08-01T00:00:00+00:00'
                        is_active:
                          type: boolean
                          example: true
                        is_open:
                          type: boolean
                          example: true
      tags:
        - Admissions
      security: []
  /api/v1/register:
    post:
      summary: 'Register and start an application.'
      operationId: registerAndStartAnApplication
      description: "Open only while an Admission Cycle's window is open: refused when none is\nopen, auto-filed into the one open Cycle, or (when several are open) filed\ninto the chosen one. Rate-limited per client. On success the applicant is\nauthenticated and their Draft Application is returned."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: draft
                    admission_cycle_id: 1
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: draft
                      admission_cycle_id:
                        type: integer
                        example: 1
        409:
          description: 'admissions closed'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Admissions are currently closed.'
                properties:
                  message:
                    type: string
                    example: 'Admissions are currently closed.'
        422:
          description: validation
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The email has already been taken.'
                  errors:
                    email:
                      - 'The email has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The email has already been taken.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
      tags:
        - Admissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "The applicant's full name."
                  example: 'Sara Applicant'
                email:
                  type: string
                  description: 'A unique email address; becomes the login.'
                  example: sara@example.com
                password:
                  type: string
                  description: 'At least 8 characters; must match the confirmation.'
                  example: correct-horse
                password_confirmation:
                  type: string
                  description: 'Repeat of the password.'
                  example: correct-horse
                admission_cycle_id:
                  type: integer
                  description: 'The open Cycle to apply to. Required only when more than one Cycle is open; otherwise the single open Cycle is used.'
                  example: 1
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  '/api/v1/applications/{application_id}/verify-email':
    get:
      summary: 'Verify email (signed link).'
      operationId: verifyEmailsignedLink
      description: "The signed, expiring link the applicant received on submitting Step 1. A\nvalid signature marks their email verified and moves a `submitted`\nApplication to `email_verified`; re-clicking is idempotent. Tampered or\nexpired links are refused (403) by the `signed` middleware."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: email_verified
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: email_verified
        403:
          description: 'bad signature'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid signature.'
                properties:
                  message:
                    type: string
                    example: 'Invalid signature.'
      tags:
        - Admissions
      security: []
    parameters:
      -
        in: path
        name: application_id
        description: 'The ID of the application the link verifies.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/application:
    get:
      summary: 'My application.'
      operationId: myApplication
      description: "The signed-in applicant's current Application — its status and the whole\nStep-1 snapshot (fields the applicant has not yet provided come back null),\nso the SPA can render and resume the wizard at the right step."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: submitted
                    admission_cycle_id: 1
                    name_en: 'Sara Applicant'
                    name_ar: 'سارة المتقدمة'
                    national_id: '29001010101010'
                    phone: '+201000000000'
                    date_of_birth: '1998-05-20'
                    nationality: Egyptian
                    gender: Female
                    address_country: Egypt
                    address_city: Alexandria
                    address_street: '15 Corniche Road'
                    previous_university: 'Cairo University'
                    graduation_certificate_name: 'BSc in Computer Science'
                    graduation_date: '2020-07-01'
                    previous_degree: BSc
                    previous_major: 'Computer Science'
                    graduation_gpa: '3.50'
                    graduation_cgpa: '3.45'
                    gpa_scale: '4.0'
                    is_ejust_graduate: false
                    applying_for_degree: MSc
                    english_test: IELTS
                    english_score: '7.50'
                    native_arabic_speaker: true
                    submitted_at: '2026-07-14T10:00:00+00:00'
                    documents:
                      -
                        id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                        document_type: graduation_certificate
                        original_filename: certificate.pdf
                        mime: application/pdf
                        size_bytes: 24576
                        uploaded_at: '2026-07-14T10:00:00+00:00'
                        download_url: 'http://localhost/api/v1/documents/01ARZ3NDEKTSV4RRFFQ69G5FAV'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: submitted
                      admission_cycle_id:
                        type: integer
                        example: 1
                      name_en:
                        type: string
                        example: 'Sara Applicant'
                      name_ar:
                        type: string
                        example: 'سارة المتقدمة'
                      national_id:
                        type: string
                        example: '29001010101010'
                      phone:
                        type: string
                        example: '+201000000000'
                      date_of_birth:
                        type: string
                        example: '1998-05-20'
                      nationality:
                        type: string
                        example: Egyptian
                      gender:
                        type: string
                        example: Female
                      address_country:
                        type: string
                        example: Egypt
                      address_city:
                        type: string
                        example: Alexandria
                      address_street:
                        type: string
                        example: '15 Corniche Road'
                      previous_university:
                        type: string
                        example: 'Cairo University'
                      graduation_certificate_name:
                        type: string
                        example: 'BSc in Computer Science'
                      graduation_date:
                        type: string
                        example: '2020-07-01'
                      previous_degree:
                        type: string
                        example: BSc
                      previous_major:
                        type: string
                        example: 'Computer Science'
                      graduation_gpa:
                        type: string
                        example: '3.50'
                      graduation_cgpa:
                        type: string
                        example: '3.45'
                      gpa_scale:
                        type: string
                        example: '4.0'
                      is_ejust_graduate:
                        type: boolean
                        example: false
                      applying_for_degree:
                        type: string
                        example: MSc
                      english_test:
                        type: string
                        example: IELTS
                      english_score:
                        type: string
                        example: '7.50'
                      native_arabic_speaker:
                        type: boolean
                        example: true
                      submitted_at:
                        type: string
                        example: '2026-07-14T10:00:00+00:00'
                      documents:
                        type: array
                        example:
                          - id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                            document_type: graduation_certificate
                            original_filename: certificate.pdf
                            mime: application/pdf
                            size_bytes: 24576
                            uploaded_at: '2026-07-14T10:00:00+00:00'
                            download_url: 'http://localhost/api/v1/documents/01ARZ3NDEKTSV4RRFFQ69G5FAV'
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                            document_type:
                              type: string
                              example: graduation_certificate
                            original_filename:
                              type: string
                              example: certificate.pdf
                            mime:
                              type: string
                              example: application/pdf
                            size_bytes:
                              type: integer
                              example: 24576
                            uploaded_at:
                              type: string
                              example: '2026-07-14T10:00:00+00:00'
                            download_url:
                              type: string
                              example: 'http://localhost/api/v1/documents/01ARZ3NDEKTSV4RRFFQ69G5FAV'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No application found.'
                properties:
                  message:
                    type: string
                    example: 'No application found.'
      tags:
        - Admissions
      security: []
    patch:
      summary: 'Save Step 1 (partial).'
      operationId: saveStep1partial
      description: "Persists whatever personal-info fields the applicant has entered so far,\nkeeping the Application a Draft so they can resume later. Each provided field\nis validated (bilingually); missing fields are allowed. Editing is only\npossible while the Application is still a Draft."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: draft
                    admission_cycle_id: 1
                    name_en: 'Sara Applicant'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: draft
                      admission_cycle_id:
                        type: integer
                        example: 1
                      name_en:
                        type: string
                        example: 'Sara Applicant'
        409:
          description: 'not editable'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This application can no longer be edited.'
                properties:
                  message:
                    type: string
                    example: 'This application can no longer be edited.'
        422:
          description: validation
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The gender field must be a valid value.'
                  errors:
                    gender:
                      - 'The gender field must be a valid value.'
                properties:
                  message:
                    type: string
                    example: 'The gender field must be a valid value.'
                  errors:
                    type: object
                    properties:
                      gender:
                        type: array
                        example:
                          - 'The gender field must be a valid value.'
                        items:
                          type: string
      tags:
        - Admissions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name_en:
                  type: string
                  description: 'Full name in English.'
                  example: 'Sara Applicant'
                name_ar:
                  type: string
                  description: 'Full name in Arabic.'
                  example: 'سارة المتقدمة'
                national_id:
                  type: string
                  description: 'National ID / passport; unique within the cycle.'
                  example: '29001010101010'
                phone:
                  type: string
                  description: 'Contact phone.'
                  example: '+201000000000'
                date_of_birth:
                  type: string
                  description: 'Date of birth (Y-m-d), in the past.'
                  example: '1998-05-20'
                nationality:
                  type: string
                  description: Nationality.
                  example: Egyptian
                gender:
                  type: string
                  description: 'One of Male, Female.'
                  example: Female
                address_country:
                  type: string
                  description: Country.
                  example: Egypt
                address_city:
                  type: string
                  description: City.
                  example: Alexandria
                address_street:
                  type: string
                  description: 'Street address.'
                  example: '15 Corniche Road'
                previous_university:
                  type: string
                  description: 'Previous university.'
                  example: 'Cairo University'
                graduation_certificate_name:
                  type: string
                  description: 'Name of the graduation certificate.'
                  example: 'BSc in Computer Science'
                graduation_date:
                  type: string
                  description: 'Graduation date (Y-m-d).'
                  example: '2020-07-01'
                previous_degree:
                  type: string
                  description: 'One of BSc, MSc, PhD.'
                  example: BSc
                previous_major:
                  type: string
                  description: 'Previous major/specialization.'
                  example: 'Computer Science'
                graduation_gpa:
                  type: number
                  description: 'Graduation GPA.'
                  example: 3.5
                graduation_cgpa:
                  type: number
                  description: 'Graduation CGPA.'
                  example: 3.45
                gpa_scale:
                  type: string
                  description: 'One of 4.0, 4.3, 5.0, 6.0, 7.0, 10.0, 100.'
                  example: '4.0'
                is_ejust_graduate:
                  type: boolean
                  description: 'Whether the applicant graduated from E-JUST.'
                  example: false
                applying_for_degree:
                  type: string
                  description: 'Degree applied for; one of MSc, PhD.'
                  example: MSc
                english_test:
                  type: string
                  description: 'English test; one of IELTS, TOEFL iBT, TOEFL PBT, PTE, Cambridge C1, Cambridge C2, Cambridge B2, Duolingo, None.'
                  example: IELTS
                english_score:
                  type: number
                  description: 'Score for the chosen test; required unless the test is None.'
                  example: 7.5
                native_arabic_speaker:
                  type: boolean
                  description: 'Whether the applicant is a native Arabic speaker.'
                  example: true
      security: []
  /api/v1/application/submit:
    post:
      summary: 'Submit Step 1.'
      operationId: submitStep1
      description: "Validates the complete personal-info snapshot, persists it, and moves the\nDraft forward: an unverified applicant to `submitted` with a fresh, signed\nverification link returned in `verification_url` (and logged); an applicant\nwhose email is already verified straight to `email_verified` (the shortcut),\nwith `verification_url` null. Either way the applicant cannot reach the\ndocuments step until their email is verified."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'verification required'
                    type: object
                    example:
                      data:
                        id: 1
                        status: submitted
                        admission_cycle_id: 1
                        name_en: 'Sara Applicant'
                      verification_url: 'http://localhost/api/v1/applications/1/verify-email?expires=1784000000&signature=abc123'
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          status:
                            type: string
                            example: submitted
                          admission_cycle_id:
                            type: integer
                            example: 1
                          name_en:
                            type: string
                            example: 'Sara Applicant'
                      verification_url:
                        type: string
                        example: 'http://localhost/api/v1/applications/1/verify-email?expires=1784000000&signature=abc123'
                  -
                    description: 'already verified'
                    type: object
                    example:
                      data:
                        id: 1
                        status: email_verified
                        admission_cycle_id: 1
                        name_en: 'Sara Applicant'
                      verification_url: null
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          status:
                            type: string
                            example: email_verified
                          admission_cycle_id:
                            type: integer
                            example: 1
                          name_en:
                            type: string
                            example: 'Sara Applicant'
                      verification_url:
                        type: string
                        example: null
                        nullable: true
        409:
          description: 'already submitted'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Step 1 has already been submitted for this application.'
                properties:
                  message:
                    type: string
                    example: 'Step 1 has already been submitted for this application.'
        422:
          description: incomplete
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The name ar field is required.'
                  errors:
                    name_ar:
                      - 'The name ar field is required.'
                properties:
                  message:
                    type: string
                    example: 'The name ar field is required.'
                  errors:
                    type: object
                    properties:
                      name_ar:
                        type: array
                        example:
                          - 'The name ar field is required.'
                        items:
                          type: string
      tags:
        - Admissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name_en:
                  type: string
                  description: 'Full name in English.'
                  example: 'Sara Applicant'
                name_ar:
                  type: string
                  description: 'Full name in Arabic.'
                  example: 'سارة المتقدمة'
                national_id:
                  type: string
                  description: 'National ID / passport; unique within the cycle.'
                  example: '29001010101010'
                phone:
                  type: string
                  description: 'Contact phone.'
                  example: '+201000000000'
                date_of_birth:
                  type: string
                  description: 'Date of birth (Y-m-d), in the past.'
                  example: '1998-05-20'
                nationality:
                  type: string
                  description: Nationality.
                  example: Egyptian
                gender:
                  type: string
                  description: 'One of Male, Female.'
                  example: Female
                address_country:
                  type: string
                  description: Country.
                  example: Egypt
                address_city:
                  type: string
                  description: City.
                  example: Alexandria
                address_street:
                  type: string
                  description: 'Street address.'
                  example: '15 Corniche Road'
                previous_university:
                  type: string
                  description: 'Previous university.'
                  example: 'Cairo University'
                graduation_certificate_name:
                  type: string
                  description: 'Name of the graduation certificate.'
                  example: 'BSc in Computer Science'
                graduation_date:
                  type: string
                  description: 'Graduation date (Y-m-d).'
                  example: '2020-07-01'
                previous_degree:
                  type: string
                  description: 'One of BSc, MSc, PhD.'
                  example: BSc
                previous_major:
                  type: string
                  description: 'Previous major/specialization.'
                  example: 'Computer Science'
                graduation_gpa:
                  type: number
                  description: 'Graduation GPA.'
                  example: 3.5
                graduation_cgpa:
                  type: number
                  description: 'Graduation CGPA.'
                  example: 3.45
                gpa_scale:
                  type: string
                  description: 'One of 4.0, 4.3, 5.0, 6.0, 7.0, 10.0, 100.'
                  example: '4.0'
                is_ejust_graduate:
                  type: boolean
                  description: 'Whether the applicant graduated from E-JUST.'
                  example: false
                applying_for_degree:
                  type: string
                  description: 'Degree applied for; one of MSc, PhD.'
                  example: MSc
                english_test:
                  type: string
                  description: 'English test; one of IELTS, TOEFL iBT, TOEFL PBT, PTE, Cambridge C1, Cambridge C2, Cambridge B2, Duolingo, None.'
                  example: IELTS
                english_score:
                  type: number
                  description: 'Score for the chosen test; required unless the test is None.'
                  example: 7.5
                native_arabic_speaker:
                  type: boolean
                  description: 'Whether the applicant is a native Arabic speaker.'
                  example: true
              required:
                - name_en
                - name_ar
                - national_id
                - phone
                - date_of_birth
                - nationality
                - gender
                - address_country
                - address_city
                - address_street
                - previous_university
                - graduation_certificate_name
                - graduation_date
                - previous_degree
                - previous_major
                - graduation_gpa
                - graduation_cgpa
                - gpa_scale
                - is_ejust_graduate
                - applying_for_degree
                - english_test
                - native_arabic_speaker
      security: []
  /api/v1/application/resend-verification:
    post:
      summary: 'Resend the verification link.'
      operationId: resendTheVerificationLink
      description: "Issues a fresh signed link for the signed-in applicant's Application (in\n`verification_url`, and logged), for recovering a missed one. Allowed only\nwhile the Application is awaiting verification (`submitted`), and throttled to\na few attempts per day (BR-72) — the sixth in a day is turned away with 429."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: submitted
                    admission_cycle_id: 1
                    name_en: 'Sara Applicant'
                  verification_url: 'http://localhost/api/v1/applications/1/verify-email?expires=1784000000&signature=abc123'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: submitted
                      admission_cycle_id:
                        type: integer
                        example: 1
                      name_en:
                        type: string
                        example: 'Sara Applicant'
                  verification_url:
                    type: string
                    example: 'http://localhost/api/v1/applications/1/verify-email?expires=1784000000&signature=abc123'
        409:
          description: 'not awaiting verification'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This application is not awaiting email verification.'
                properties:
                  message:
                    type: string
                    example: 'This application is not awaiting email verification.'
        429:
          description: throttled
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Too Many Attempts.'
                properties:
                  message:
                    type: string
                    example: 'Too Many Attempts.'
      tags:
        - Admissions
      security: []
  /api/v1/application/documents:
    post:
      summary: 'Upload a document.'
      operationId: uploadADocument
      description: "Validates the file against the chosen {@see DocumentType}'s rules — allowed\nformats, size ceiling, and how many of that type the application may hold —\nstores it on the private disk under a fresh ULID, and returns the created\ndocument. A bad type, wrong format, oversize file, or one copy too many is a\n422; uploading once the application has left the applicant's hands is a 409."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                    document_type: graduation_certificate
                    original_filename: certificate.pdf
                    mime: application/pdf
                    size_bytes: 24576
                    uploaded_at: '2026-07-14T10:00:00+00:00'
                    download_url: 'http://localhost/api/v1/documents/01ARZ3NDEKTSV4RRFFQ69G5FAV'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                      document_type:
                        type: string
                        example: graduation_certificate
                      original_filename:
                        type: string
                        example: certificate.pdf
                      mime:
                        type: string
                        example: application/pdf
                      size_bytes:
                        type: integer
                        example: 24576
                      uploaded_at:
                        type: string
                        example: '2026-07-14T10:00:00+00:00'
                      download_url:
                        type: string
                        example: 'http://localhost/api/v1/documents/01ARZ3NDEKTSV4RRFFQ69G5FAV'
        409:
          description: 'documents locked'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Documents can no longer be changed for this application.'
                properties:
                  message:
                    type: string
                    example: 'Documents can no longer be changed for this application.'
        422:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'over the cap'
                    type: object
                    example:
                      message: 'You can upload at most 1 document of this type.'
                      errors:
                        document_type:
                          - 'You can upload at most 1 document of this type.'
                    properties:
                      message:
                        type: string
                        example: 'You can upload at most 1 document of this type.'
                      errors:
                        type: object
                        properties:
                          document_type:
                            type: array
                            example:
                              - 'You can upload at most 1 document of this type.'
                            items:
                              type: string
                  -
                    description: 'bad file'
                    type: object
                    example:
                      message: 'The file must be a file of type: application/pdf, image/jpeg, image/png.'
                      errors:
                        file:
                          - 'The file must be a file of type: application/pdf, image/jpeg, image/png.'
                    properties:
                      message:
                        type: string
                        example: 'The file must be a file of type: application/pdf, image/jpeg, image/png.'
                      errors:
                        type: object
                        properties:
                          file:
                            type: array
                            example:
                              - 'The file must be a file of type: application/pdf, image/jpeg, image/png.'
                            items:
                              type: string
      tags:
        - Admissions
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document_type:
                  type: string
                  description: 'The kind of document. One of graduation_certificate, transcript, national_id, photo, english_certificate, msc_thesis, cv, recommendation_letter, additional_certificate.'
                  example: graduation_certificate
                file:
                  type: string
                  format: binary
                  description: "The file to upload (PDF or image, within the type's size limit)."
              required:
                - document_type
                - file
      security: []
  '/api/v1/application/documents/{document_ulid}':
    delete:
      summary: 'Remove a document.'
      operationId: removeADocument
      description: "Deletes the file (bytes and metadata) from the signed-in applicant's own\napplication, freeing its slot so a replacement can be uploaded. Allowed only\nwhile the application is still applicant-editable; a document that is not the\ncurrent applicant's is a 404, and a locked application is a 409."
      parameters: []
      responses:
        204:
          description: removed
          content:
            text/plain:
              schema:
                type: string
                example: ''
        404:
          description: 'not the applicant’s document'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Not found.'
                properties:
                  message:
                    type: string
                    example: 'Not found.'
        409:
          description: 'documents locked'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Documents can no longer be changed for this application.'
                properties:
                  message:
                    type: string
                    example: 'Documents can no longer be changed for this application.'
      tags:
        - Admissions
      security: []
    parameters:
      -
        in: path
        name: document_ulid
        description: 'The ULID of the document to remove.'
        example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
        required: true
        schema:
          type: string
  '/api/v1/documents/{document_ulid}':
    get:
      summary: 'Stream a document.'
      operationId: streamADocument
      description: "Serves the stored file inline to the owning applicant or to a reviewer holding\n`application.screen`; anyone else is refused with a 403. The ULID in the path\nis the only handle — the storage path and row id are never exposed."
